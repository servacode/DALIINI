# The whole local stack in one command:
#
#   pnpm stack:up      # build and start everything, apply migrations
#   pnpm stack:seed    # operators, an owner and a directory with something in every section
#   pnpm stack:down    # stop (data is kept in named volumes; add -v to the command to wipe it)
#
# Then `pnpm dev:admin` (http://localhost:3000) and `pnpm dev:web` (http://localhost:3001).
#
# Every credential here is a development-only constant. None of them may be reused for any
# server anyone else can reach.

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: directory_backend.settings.development
  ENVIRONMENT: development
  SECRET_KEY: development-only-not-for-production
  DATABASE_URL: postgresql://directory:directory@postgres:5432/directory
  REDIS_URL: redis://redis:6379/0
  ALLOWED_HOSTS: localhost,127.0.0.1,api
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
  CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
  # The API reaches storage on the compose network; a browser reaches the same objects on the
  # host's port 9000, which is the address public media URLs are written with.
  S3_ENDPOINT_URL: http://s3:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: directory-dev
  S3_SECRET_ACCESS_KEY: directory-dev-only-change-me
  S3_PUBLIC_BUCKET: directory-public
  S3_PRIVATE_BUCKET: directory-private
  S3_PUBLIC_MEDIA_BASE_URL: http://localhost:9000/directory-public
  # Codes are not sent anywhere locally; `manage.py e2e_set_otp` sets a known one.
  OTP_PROVIDER: development
  PUSH_PROVIDER: development

x-backend: &backend
  build:
    context: ../../apps/backend
    dockerfile: Dockerfile
  working_dir: /app
  environment: *backend-env
  volumes:
    # The source is mounted so a change is picked up without a rebuild. The image's own
    # virtual environment is kept by the anonymous volume, which the mount would otherwise hide.
    - ../../apps/backend:/app
    - /app/.venv
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: directory
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory -d directory"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - directory_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - directory_redis:/data

  # S3-compatible object storage. MinIO used to fill this place; its community images are no
  # longer published, so a fresh machine could not start the stack at all. SeaweedFS keeps the
  # same isolation: anyone may read an object in the public bucket, nobody may list it, and the
  # private bucket (verification documents) refuses every anonymous request.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "9000:8333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - directory_s3:/data

  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      - s3
    entrypoint: ["sh", "-c"]
    # Safe to run on every start: a bucket that already exists is left alone, and any other
    # failure still stops the stack, because the API cannot store a photograph without them.
    command:
      - >-
        for i in $$(seq 1 60); do wget -q -O /dev/null http://s3:8888/ && break; sleep 1; done;
        existing=$$(echo s3.bucket.list | weed shell -master=s3:9333 -filer=s3:8888) || exit 1;
        for bucket in directory-public directory-private; do
        echo "$$existing" | grep -qw "$$bucket" ||
        echo "s3.bucket.create -name $$bucket" | weed shell -master=s3:9333 -filer=s3:8888 || exit 1;
        done

  api:
    <<: *backend
    command:
      - sh
      - -c
      - uv run python manage.py migrate --noinput && uv run python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["uv", "run", "celery", "-A", "directory_backend", "worker", "-l", "INFO"]
    # The image HEALTHCHECK probes HTTP /health/live/; the worker serves no HTTP.
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: ["uv", "run", "celery", "-A", "directory_backend", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

volumes:
  directory_postgres:
  directory_redis:
  directory_s3:
