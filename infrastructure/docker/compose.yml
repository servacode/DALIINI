services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: directory
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory -d directory"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - directory_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - directory_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: directory-dev
      MINIO_ROOT_PASSWORD: directory-dev-only-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - directory_minio:/data

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    command: uv run daphne -b 0.0.0.0 -p 8000 directory_backend.asgi:application
    working_dir: /app
    environment:
      DJANGO_SETTINGS_MODULE: directory_backend.settings.development
      ENVIRONMENT: development
      SECRET_KEY: development-only-not-for-production
      DATABASE_URL: postgresql://directory:directory@postgres:5432/directory
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: directory-dev
      S3_SECRET_ACCESS_KEY: directory-dev-only-change-me
      S3_PUBLIC_BUCKET: directory-public
      S3_PRIVATE_BUCKET: directory-private
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    command: uv run celery -A directory_backend worker -l INFO
    working_dir: /app
    # The image HEALTHCHECK probes HTTP /health/live/; the worker serves no HTTP.
    healthcheck:
      disable: true
    environment:
      DJANGO_SETTINGS_MODULE: directory_backend.settings.development
      ENVIRONMENT: development
      SECRET_KEY: development-only-not-for-production
      DATABASE_URL: postgresql://directory:directory@postgres:5432/directory
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: directory-dev
      S3_SECRET_ACCESS_KEY: directory-dev-only-change-me
      S3_PUBLIC_BUCKET: directory-public
      S3_PRIVATE_BUCKET: directory-private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  directory_postgres:
  directory_redis:
  directory_minio:
