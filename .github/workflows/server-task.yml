name: Server task

# One of a few named jobs on an environment's server, run as root over SSH from here because the
# team's network cannot reach port 22 (DECISION-121). Each task is the command the production
# README gives for it; nothing else can be run through this workflow.
#
# * timers: install and start the hourly backup, the monthly restore drill and the monthly map
#   rebuild, take one backup now, and start the first map build in the background.
# * status: the stack, the timers, memory and disk.
# * create-operator: the first operator (README, "First start"), with the password kept as this
#   environment's OPERATOR_PASSWORD secret; the operator changes it from the console.
# * create-review-account: the account a store's reviewers sign in with (DECISION-123), its
#   password kept as this environment's REVIEW_PASSWORD secret; run again to change it.
# * boundaries: Syria's boundaries and quarters from the map's extract (import-boundaries.sh).
# * inventory: what the database holds, counted and listed by name, read only.
# * maintenance-on / maintenance-off: the switch the console's Settings page also holds, for
#   before an operator exists.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's server
        type: choice
        options: [production, staging]
        required: true
      task:
        description: What to run
        type: choice
        options: [status, inventory, timers, boundaries, create-operator, create-review-account, maintenance-on, maintenance-off]
        required: true
      phone:
        description: create-operator and create-review-account, the account's Syrian mobile number
        type: string
        required: false
      name:
        description: create-operator only, the operator's name
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: server-task-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: SSH
        env:
          KEY: ${{ secrets.SERVER_ROOT_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/root
          chmod 600 ~/.ssh/root
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Run
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TASK: ${{ inputs.task }}
          ENVIRONMENT: ${{ inputs.environment }}
          PHONE: ${{ inputs.phone }}
          NAME: ${{ inputs.name }}
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}
        run: |
          remote() { ssh -i ~/.ssh/root -o StrictHostKeyChecking=yes "root@$HOST" "$@"; }
          stack=/srv/daliini/repo/infrastructure/production
          compose="docker compose -p \$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' /srv/daliini/$ENVIRONMENT.env)"
          compose="$compose -f $stack/compose.yml --env-file /srv/daliini/$ENVIRONMENT.env"
          manage="$compose exec -T api uv run python manage.py"
          case "$TASK" in
            status)
              remote "$compose ps --format '{{.Service}}\t{{.State}}\t{{.Status}}';
                systemctl list-timers 'daliini-*' --no-pager; free -h; df -h /;
                systemctl is-active daliini-map.service || true; journalctl -u daliini-map -n 25 --no-pager"
              ;;
            inventory)
              remote "$manage shell -c \"
          from accounts.models import User
          from facilities.models import Facility
          from ratings.models import Rating
          from favorites.models import Favorite
          from notifications.models import Notification
          print('USERS')
          for u in User.objects.order_by('created_at'):
              print(' ', u.phone[-4:], u.name, 'active' if u.is_active else 'off', 'staff-role' if u.admin_role_links.filter(active=True).exists() else '')
          print('FACILITIES')
          for f in Facility.objects.select_related('category').order_by('created_at'):
              print(' ', f.name_ar, '|', f.category.name_ar, '|', f.status)
          print('ratings', Rating.objects.count(), 'favorites', Favorite.objects.count(), 'notifications', Notification.objects.count())
          \""
              ;;
            timers)
              remote "set -e; cp $stack/systemd/daliini-*.service $stack/systemd/daliini-*.timer /etc/systemd/system/;
                systemctl daemon-reload;
                systemctl enable --now daliini-backup.timer daliini-restore-drill.timer daliini-map.timer;
                systemctl start daliini-backup.service; journalctl -u daliini-backup -n 15 --no-pager;
                systemctl start --no-block daliini-map.service; echo 'map build started'"
              ;;
            boundaries)
              # The deployed checkout's script: deploy a commit that has it first.
              remote "bash /srv/daliini/repo/infrastructure/production/import-boundaries.sh /srv/daliini/$ENVIRONMENT.env"
              ;;
            create-operator)
              if ! [[ "$PHONE" =~ ^[+0-9\ ]{9,16}$ ]] || [ -z "$NAME" ] || [ -z "$OPERATOR_PASSWORD" ]; then
                echo "::error::create-operator needs phone, name and the OPERATOR_PASSWORD secret"
                exit 1
              fi
              # No terminal on the server's side, so the command reads the password twice from stdin.
              # The name travels as base64, so no quote in it can reach the remote shell.
              encoded="$(printf %s "$NAME" | base64 -w0)"
              printf '%s\n%s\n' "$OPERATOR_PASSWORD" "$OPERATOR_PASSWORD" |
                remote "$manage grant_operator '$PHONE' --create --name \"\$(echo $encoded | base64 -d)\""
              ;;
            create-review-account)
              if ! [[ "$PHONE" =~ ^[+0-9\ ]{9,16}$ ]] || [ -z "$REVIEW_PASSWORD" ]; then
                echo "::error::create-review-account needs phone and the REVIEW_PASSWORD secret"
                exit 1
              fi
              printf '%s\n%s\n' "$REVIEW_PASSWORD" "$REVIEW_PASSWORD" |
                remote "$manage create_review_account '$PHONE'"
              ;;
            maintenance-on|maintenance-off)
              value=$([ "$TASK" = maintenance-on ] && echo True || echo False)
              remote "$manage shell -c \"from platform_settings.models import PlatformSetting as S;
          from platform_settings.maintenance import ENABLED_KEY, invalidate_maintenance_cache;
          S.objects.filter(key=ENABLED_KEY).update(value=$value); invalidate_maintenance_cache();
          print('maintenance', $value)\""
              ;;
          esac
