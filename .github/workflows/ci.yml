name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-governance.mjs
      - run: node packages/design-tokens/scripts/validate.mjs
      - run: node packages/design-tokens/scripts/generate.mjs --check
      - run: node packages/design-tokens/scripts/vocabulary.mjs --check
      - run: node packages/design-tokens/scripts/icons.mjs --check
      # The two source gates that need no runtime. Until now nothing ran them, which is how the
      # secret scan came to fail on a dependency's compiled WebAssembly for an unknown length of
      # time: a gate nobody executes reports nothing.
      - name: Secret-shaped material and source security invariants
        run: python3 infrastructure/quality/source_security.py
      - name: No open P0/P1 release blocker
        run: python3 infrastructure/quality/release_blockers.py

  backend-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: directory
          POSTGRES_USER: directory
          POSTGRES_PASSWORD: directory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U directory -d directory"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://directory:directory@localhost:5432/directory
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install GeoDjango native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          python-version: "3.13"
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv run python manage.py check --settings=directory_backend.settings.test
      - run: uv run python manage.py makemigrations --check --dry-run --settings=directory_backend.settings.test

  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GeoDjango native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: apps/backend
        run: uv sync --dev --frozen
      - name: Fail on OpenAPI drift
        run: ./scripts/check-openapi-drift.sh
      - name: Generate the API clients
        run: ./scripts/generate-api-clients.sh
      - name: Fail on generated client drift
        run: |
          if [[ -n "$(git status --porcelain -- packages/api-typescript packages/api-kotlin packages/api-swift)" ]]; then
            echo "FAIL: generated clients differ from the committed artefacts." >&2
            git --no-pager status --porcelain -- packages/api-typescript packages/api-kotlin packages/api-swift >&2
            exit 1
          fi
          echo "PASS: generated clients match the committed artefacts."

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # No `version:` input: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Admin lint
        run: pnpm --filter @servacode/admin lint
      - name: Admin typecheck
        run: pnpm --filter @servacode/admin typecheck
      - name: Admin unit tests
        run: pnpm --filter @servacode/admin test
      - name: Admin build
        # Placeholder origins: the build validates they are set, nothing is contacted.
        env:
          ADMIN_API_ORIGIN: http://127.0.0.1:9
          ADMIN_PUBLIC_ORIGIN: http://127.0.0.1:3100
        run: pnpm --filter @servacode/admin build
      - name: Web lint
        run: pnpm --filter @servacode/public-web lint
      - name: Web typecheck
        run: pnpm --filter @servacode/public-web typecheck
      # apps/web has no `test` script; --if-present picks one up once it exists.
      - name: Web tests
        run: pnpm --filter @servacode/public-web run --if-present test
      - name: Web build
        run: pnpm --filter @servacode/public-web build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Contexts match render.yaml: the Next apps build from the monorepo root,
          # the backend from its own directory.
          - name: backend
            context: apps/backend
            file: apps/backend/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: admin
            context: .
            file: apps/admin/Dockerfile
          - name: db-backup
            context: .
            file: infrastructure/backup/Dockerfile
    name: docker-build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
