name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-governance.mjs
      - run: node packages/design-tokens/scripts/validate.mjs
      - run: node packages/design-tokens/scripts/generate.mjs --check

  backend-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv run python manage.py check --settings=directory_backend.settings.test
      - run: uv run python manage.py makemigrations --check --dry-run --settings=directory_backend.settings.test
