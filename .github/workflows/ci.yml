name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-governance.mjs
      - run: node packages/design-tokens/scripts/validate.mjs
      - run: node packages/design-tokens/scripts/generate.mjs --check
      - run: node packages/design-tokens/scripts/vocabulary.mjs --check
      - run: node packages/design-tokens/scripts/icons.mjs --check
      # The two source gates that need no runtime. Until now nothing ran them, which is how the
      # secret scan came to fail on a dependency's compiled WebAssembly for an unknown length of
      # time: a gate nobody executes reports nothing.
      - name: Secret-shaped material and source security invariants
        run: python3 infrastructure/quality/source_security.py
      - name: No open P0/P1 release blocker
        run: python3 infrastructure/quality/release_blockers.py
      - name: The production stack's shape and fail-closed rules
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 infrastructure/scripts/qualify-production-stack.py

  backend-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: directory
          POSTGRES_USER: directory
          POSTGRES_PASSWORD: directory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U directory -d directory"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://directory:directory@localhost:5432/directory
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install GeoDjango native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          python-version: "3.13"
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv run python manage.py check --settings=directory_backend.settings.test
      - run: uv run python manage.py makemigrations --check --dry-run --settings=directory_backend.settings.test

  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GeoDjango native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: apps/backend
        run: uv sync --dev --frozen
      - name: Fail on OpenAPI drift
        run: ./scripts/check-openapi-drift.sh
      - name: Generate the API clients
        run: ./scripts/generate-api-clients.sh
      - name: Fail on generated client drift
        run: |
          if [[ -n "$(git status --porcelain -- packages/api-typescript packages/api-kotlin packages/api-swift packages/api-kotlin-multiplatform)" ]]; then
            echo "FAIL: generated clients differ from the committed artefacts." >&2
            git --no-pager status --porcelain -- packages/api-typescript packages/api-kotlin packages/api-swift packages/api-kotlin-multiplatform >&2
            exit 1
          fi
          echo "PASS: generated clients match the committed artefacts."

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # No `version:` input: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Admin lint
        run: pnpm --filter @servacode/admin lint
      - name: Admin typecheck
        run: pnpm --filter @servacode/admin typecheck
      - name: Admin unit tests
        run: pnpm --filter @servacode/admin test
      - name: Admin build
        # Placeholder origins: the build validates they are set, nothing is contacted.
        env:
          ADMIN_API_ORIGIN: http://127.0.0.1:9
          ADMIN_PUBLIC_ORIGIN: http://127.0.0.1:3100
        run: pnpm --filter @servacode/admin build
      - name: Web lint
        run: pnpm --filter @servacode/public-web lint
      - name: Web typecheck
        run: pnpm --filter @servacode/public-web typecheck
      - name: Web unit tests
        run: pnpm --filter @servacode/public-web test
      - name: Web build
        run: pnpm --filter @servacode/public-web build

  # The OTP bot (services/whatsapp-bot). Deliberately outside the pnpm workspace — an
  # unofficial WhatsApp library has no business in the website's dependency tree — so it is
  # gated on its own. Its rules are pure, so they prove themselves with nothing installed.
  whatsapp-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pacing and addressing rules
        run: node --test test/*.test.js
        working-directory: services/whatsapp-bot
      - name: Every source file parses
        # The session and server modules import Baileys, which is not installed here; a syntax
        # check still catches what a test cannot reach without a paired WhatsApp account.
        run: node --check src/session.js && node --check src/server.js && node --check src/pair.js && node --check src/message.js && node --check src/queue.js
        working-directory: services/whatsapp-bot

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Contexts match infrastructure/production/compose.yml: the Next apps build from the
          # monorepo root, the backend from its own directory.
          - name: backend
            context: apps/backend
            file: apps/backend/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: admin
            context: .
            file: apps/admin/Dockerfile
          - name: db-backup
            context: .
            file: infrastructure/backup/Dockerfile
          - name: whatsapp-bot
            context: services/whatsapp-bot
            file: services/whatsapp-bot/Dockerfile
    name: docker-build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The production stack as the server runs it (DECISION-080): every image built, the whole stack
  # started with throwaway values, and each name asked through Caddy, TLS included.
  # The base map's Arabic labels, drawn by the site's own MapLibre and RTL plugin in a real
  # browser (DECISION-082): one tile of Raqqa served by Martin with the brand's glyphs and the
  # map's icons. The labels must come out joined and right to left, and the style must load at
  # all: an expression MapLibre on the web refuses fails the whole map, not one layer.
  map-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @servacode/public-web exec playwright install --with-deps chromium
      - name: Serve one tile of Raqqa
        run: |
          map="$RUNNER_TEMP/map"
          python3 infrastructure/production/map/fixture.py "$map"
          python3 infrastructure/production/map/bind-style.py http://127.0.0.1:3000 "$map/syria.pmtiles" "$map/styles/daliini.json"
          infrastructure/production/map/serve.sh "$map"
      - name: Draw it and read the labels back
        working-directory: apps/web
        run: >-
          node scripts/map-render-check.mjs --style http://127.0.0.1:3000/style/daliini
          --out "$RUNNER_TEMP/labels" --min-arabic 2
          --view "city:38.995,35.942,12.6:الرقة|المنصورة"
          --view "street:39.0089,35.9506,13.6:الرقة|شارع تل أبيض"
          --view "pharmacy:39.0115,35.9515,15.6:صيدلية الشفاء"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-labels
          path: ${{ runner.temp }}/labels

  production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Then five thousand made-up facilities and forty visitors for a minute, through Caddy,
      # held to each screen's p95 (infrastructure/load/public.js, DECISION-083).
      - name: Boot the stack, ask it, and load it
        env:
          SMOKE_LOAD: '1'
        run: infrastructure/production/smoke.sh
