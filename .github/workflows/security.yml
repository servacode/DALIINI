name: Security

# Dependency and filesystem vulnerability gates. pnpm audit and Trivy fail only on HIGH
# or CRITICAL findings; pip-audit cannot filter by severity, so any known advisory in the
# shipped Python set fails. Lower severities elsewhere are left to Dependabot's weekly PRs.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          python-version: "3.13"
      # pip-audit has no severity filter (any known vuln fails); audit the locked runtime set
      # exactly as it ships (uv export of uv.lock, hashes included).
      - name: Export locked requirements
        working-directory: apps/backend
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  node-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: pnpm audit (high and critical block)
        run: pnpm audit --audit-level high

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The releases are tagged with a leading v; `0.33.1` without it is not a ref.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
