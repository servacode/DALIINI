name: Android release

# The production app, signed with the upload key, built against an environment's addresses and
# published for download from the site (DECISION-122): the APK goes to the public bucket as
# app/daliini.apk (what the site's download button points at) and app/daliini-<code>.apk.
# The same signed build is what Play will later take as a bundle.
#
# The environment's secrets: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEY_ALIAS,
# ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_PASSWORD; DIRECTORY_FIREBASE_APPLICATION_ID
# for this package (the project, key and sender are the repository's); and the media bucket's
# S3_* keys, which Deploy uses too. Its variable ROOT_DOMAIN names every address.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment the app talks to
        type: choice
        options: [production]
        required: true

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      DIRECTORY_FIREBASE_PROJECT_ID: ${{ secrets.DIRECTORY_FIREBASE_PROJECT_ID }}
      DIRECTORY_FIREBASE_APPLICATION_ID: ${{ secrets.DIRECTORY_FIREBASE_APPLICATION_ID }}
      DIRECTORY_FIREBASE_API_KEY: ${{ secrets.DIRECTORY_FIREBASE_API_KEY }}
      DIRECTORY_FIREBASE_SENDER_ID: ${{ secrets.DIRECTORY_FIREBASE_SENDER_ID }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: The addresses and the build number
        run: |
          [ -n "$ROOT_DOMAIN" ] || { echo "::error::set ROOT_DOMAIN in the environment"; exit 1; }
          {
            # Above every build already published (DECISION-079); runs only ever count up.
            echo "DIRECTORY_VERSION_CODE=$((1000 + ${{ github.run_number }}))"
            echo "DIRECTORY_API_BASE_URL=https://api.$ROOT_DOMAIN/"
            echo "DIRECTORY_REALTIME_WS_URL=wss://api.$ROOT_DOMAIN/ws/v1/directory/"
            echo "DIRECTORY_MAP_STYLE_URL=https://maps.$ROOT_DOMAIN/style/daliini"
            echo "DIRECTORY_ROUTING_BASE_URL=https://maps.$ROOT_DOMAIN/routing/"
            # Not called by the app (place names come from the API), but checked like the rest.
            echo "DIRECTORY_GEOCODING_BASE_URL=https://api.$ROOT_DOMAIN/"
            echo "DIRECTORY_APP_LINK_HOST=$ROOT_DOMAIN"
          } >> "$GITHUB_ENV"

      - name: The upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "ANDROID_UPLOAD_KEYSTORE_PATH=$keystore"
            echo "ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleProductionRelease --stacktrace

      - name: Publish for download
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
          BUCKET: ${{ secrets.S3_PUBLIC_BUCKET }}
        run: |
          apk="$(ls app/build/outputs/apk/production/release/*.apk | head -n 1)"
          code="$DIRECTORY_VERSION_CODE"
          for key in "app/daliini-$code.apk" "app/daliini.apk"; do
            aws s3 cp "$apk" "s3://$BUCKET/$key" --endpoint-url "$ENDPOINT" \
              --content-type application/vnd.android.package-archive --cache-control "no-cache" --only-show-errors
          done
          {
            echo "### Published"
            echo "Build $code: https://media.$ROOT_DOMAIN/app/daliini.apk"
            echo "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "https://media.$ROOT_DOMAIN/app/daliini.apk"
