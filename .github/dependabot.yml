# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem so review stays manageable; majors arrive as individual PRs.
#
# Every update targets main explicitly. Without it Dependabot targets the repository's
# default branch, which was still an old working branch, so its PRs landed where nothing
# would ever be released from.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Root pnpm workspace (apps/admin, apps/web, packages/*) — one pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # apps/backend is managed by uv (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /apps/backend
    target-branch: main
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    target-branch: main
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/web
      - /apps/admin
    target-branch: main
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
