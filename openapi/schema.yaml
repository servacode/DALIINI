          type: boolean
          description: 'Whether the doors are open at this moment, by the facility''s
            own business hours and temporary closures. Independent of duty: unlike
            `state`, which collapses both into one value and lets DUTY win, this stays
            true for a facility that is open while its duty shift runs.'
