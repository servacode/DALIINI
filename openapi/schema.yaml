        slug:
          type: string
          description: 'Stable, readable and never changed once set: the category''s
            address on the site.'
          pattern: ^[-a-zA-Z0-9_]+$
        nameAr:
          type: string
        nameEn:
          type: string
          nullable: true
        iconKey:
          type: string
          nullable: true
        group:
          $ref: '#/components/schemas/NamedRef'
        capabilities:
          $ref: '#/components/schemas/CategoryCapabilities'
      required:
      - capabilities
      - group
      - iconKey
      - id
      - nameAr
      - nameEn
      - slug
    PublicCategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicCategory'
      required:
      - items
    PublicCategoryTags:
      type: object
      description: What a category's facilities can be filtered by, and what an owner
        can pick.
      properties:
        specialties:
          type: array
          items:
            $ref: '#/components/schemas/NamedIntRef'
          description: 'Active specialties, in the operators'' order: the category''s
            own and those of its specialization. Send an id back as `specialtyId`.'
        services:
          type: array
          items:
            $ref: '#/components/schemas/NamedIntRef'
          description: Active services of the category, in order. Send an id back
            as `serviceTagId`.
      required:
      - services
      - specialties
    PublicCity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
          nullable: true
      required:
      - code
      - id
      - nameAr
      - nameEn
    PublicCityList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicCity'
      required:
      - items
    PublicDutyDay:
      type: object
      properties:
        date:
          type: string
          format: date
          description: A Damascus calendar day.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompactFacility'
          description: Pharmacies on duty that day, by Arabic name, at most 200.
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/PublicDutyShift'
          description: Their shifts overlapping that day, by start time.
      required:
      - date
      - items
      - shifts
    PublicDutyRoster:
      type: object
      properties:
        provinceId:
          type: string
          format: uuid
        days:
          type: array
          items:
            $ref: '#/components/schemas/PublicDutyDay'
      required:
      - days
      - provinceId
    PublicDutyShift:
      type: object
      properties:
        facilityId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
      - endsAt
      - facilityId
      - startsAt
    PublicFacilityDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: 'Readable words for the facility''s link, from its Arabic name
            (`/f/{id}/{slug}`). Decoration only: the id is the address, so a rename
            never breaks a link.'
        nameAr:
          type: string
        nameEn:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/BilingualRef'
        city:
          allOf:
          - $ref: '#/components/schemas/NamedRef'
          nullable: true
        distanceMeters:
          type: number
          format: double
          nullable: true
          description: Great-circle distance in metres from the supplied coordinates.
            Null when no coordinates were supplied; clients never compute it locally.
        ratingAverage:
          type: number
          format: double
          nullable: true
        ratingCount:
          type: integer
        availability:
          $ref: '#/components/schemas/Availability'
        addressAr:
          type: string
          nullable: true
          description: Street address, so a row says where it is without being opened.
        neighborhood:
          allOf:
          - $ref: '#/components/schemas/NamedRef'
          nullable: true
        phone:
          type: string
          nullable: true
          description: Public telephone number, so a row can be called without opening
            it.
        whatsapp:
          type: string
          nullable: true
          description: WhatsApp contact, E.164 Syrian mobile (+9639XXXXXXXX).
        location:
          allOf:
          - $ref: '#/components/schemas/Coordinates'
          nullable: true
          description: Where it is, so a row can be navigated to without opening it.
        isFavorite:
          type: boolean
          description: Whether the caller has saved this facility. False for anonymous
            callers; resolved for a whole page in one subquery.
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: The facility's first photograph, in the order its owner arranged
            them, or null when it has none. A public media URL; clients never build
            one.
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: When an operator last approved this facility's details (trust
            signal).
        infoConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: The most recent of `lastVerifiedAt` and the owner's own confirmation
            that the opening hours are still right. Null when neither ever happened.
        updatedAt:
          type: string
          format: date-time
          description: Last change to the facility record.
        descriptionAr:
          type: string
          nullable: true
        descriptionEn:
          type: string
          nullable: true
        addressEn:
          type: string
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/FacilityImage'
        specialties:
          type: array
          items:
            $ref: '#/components/schemas/NamedIntRef'
          description: Active specialties, in the operators' order.
        services:
          type: array
          items:
            $ref: '#/components/schemas/NamedIntRef'
          description: Active services, in the operators' order.
        hours:
          type: array
          items:
            $ref: '#/components/schemas/PublicHoursEntry'
      required:
      - addressAr
      - addressEn
      - availability
      - category
      - city
      - descriptionAr
      - descriptionEn
      - distanceMeters
      - hours
      - id
      - imageUrl
      - images
      - infoConfirmedAt
      - isFavorite
      - lastVerifiedAt
      - location
      - nameAr
      - nameEn
      - neighborhood
      - phone
      - ratingAverage
      - ratingCount
      - services
      - slug
      - specialties
      - updatedAt
      - whatsapp
    PublicHome:
      type: object
      properties:
        ads:
          type: array
          items:
            $ref: '#/components/schemas/PublicAdvertisement'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/HomeCategory'
        nearby:
          type: array
          items:
            $ref: '#/components/schemas/CompactFacility'
        openNearby:
          type: array
          items:
            $ref: '#/components/schemas/CompactFacility'
        dutyNow:
          type: array
          items:
            $ref: '#/components/schemas/CompactFacility'
        serverTime:
          type: string
          format: date-time
          description: Authoritative server time in UTC, so clients do not trust the
            device clock.
      required:
      - ads
      - categories
      - dutyNow
      - nearby
      - openNearby
      - serverTime
    PublicHoursEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        opensAt:
          type: string
          format: time
        closesAt:
          type: string
          format: time
        sequence:
          type: integer
      required:
      - closesAt
      - id
      - opensAt
      - sequence
      - weekday
    PublicImageUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    PublicLocationResolve:
      type: object
      properties:
        province:
          allOf:
          - $ref: '#/components/schemas/PublicProvince'
          nullable: true
        city:
          allOf:
          - $ref: '#/components/schemas/PublicPlace'
          nullable: true
        neighborhood:
          allOf:
          - $ref: '#/components/schemas/PublicPlace'
          nullable: true
        label:
          type: string
          nullable: true
          description: 'What the app shows the user: the province, and the finer place
            when known.'
        resolvedBy:
          allOf:
          - $ref: '#/components/schemas/ResolvedByEnum'
          description: |-
            BOUNDARY when the point falls inside a seeded city or neighbourhood, NEAREST_PROVINCE when only the closest province centre could be used, NONE when the point is outside every province this platform serves.

            * `BOUNDARY` - BOUNDARY
            * `NEAREST_PROVINCE` - NEAREST_PROVINCE
            * `NONE` - NONE
      required:
      - city
      - label
      - neighborhood
      - province
      - resolvedBy
    PublicPlace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nameAr:
          type: string
        nameEn:
          type: string
          nullable: true
      required:
      - id
      - nameAr
      - nameEn
    PublicProvince:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
          nullable: true
        mapCenter:
          allOf:
          - $ref: '#/components/schemas/Coordinates'
          nullable: true
          description: Where a map opens for this province when the user's own position
            is unknown. Null when no centre has been set.
      required:
      - code
      - id
      - mapCenter
      - nameAr
      - nameEn
    PublicProvinceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicProvince'
      required:
      - items
    PushPlatformEnum:
      enum:
      - ANDROID
      - IOS
      type: string
      description: |-
        * `ANDROID` - Android
        * `IOS` - iOS
    PushToken:
      type: object
      properties:
        token:
          type: string
          maxLength: 4096
      required:
      - token
    PushTokenRegister:
      type: object
      description: The device's current provider token. It is stored encrypted and
        never returned.
      properties:
        platform:
          $ref: '#/components/schemas/PushPlatformEnum'
        token:
          type: string
          maxLength: 4096
      required:
      - platform
      - token
    RatingWrite:
      type: object
      properties:
        stars:
          type: integer
          maximum: 5
          minimum: 1
      required:
      - stars
    ReceivedFacility:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nameAr:
          type: string
        categoryNameAr:
          type: string
        provinceNameAr:
          type: string
      required:
      - categoryNameAr
      - id
      - nameAr
      - provinceNameAr
    ReceivedInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/FacilityMemberRoleEnum'
        facility:
          $ref: '#/components/schemas/ReceivedFacility'
        invitedByName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
      - createdAt
      - expiresAt
      - facility
      - id
      - invitedByName
      - role
    ReceivedInvitationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedInvitation'
      required:
      - items
    RecoveryReset:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        password:
          type: string
          writeOnly: true
      required:
      - challengeId
      - password
    RecoveryStart:
      type: object
      properties:
        phone:
          type: string
      required:
      - phone
    Refresh:
      type: object
      properties:
        refreshToken:
          type: string
          writeOnly: true
      required:
      - refreshToken
    RegisterComplete:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 120
        password:
          type: string
          writeOnly: true
        platform:
          type: string
          default: UNKNOWN
          maxLength: 32
        deviceName:
          type: string
          default: ''
          maxLength: 120
      required:
      - challengeId
      - displayName
      - password
    RegisterStart:
      type: object
      description: |-
        What is needed to send a code: a number, and where the account will live.

        The name is not asked for here. Nothing should be collected about a person before
        they have shown the number is theirs, and a name given to a challenge that is never
        completed is a name stored for nothing.
      properties:
        phone:
          type: string
        provinceId:
          type: string
          format: uuid
      required:
      - phone
      - provinceId
    ResolvedByEnum:
      enum:
      - BOUNDARY
      - NEAREST_PROVINCE
      - NONE
      type: string
      description: |-
        * `BOUNDARY` - BOUNDARY
        * `NEAREST_PROVINCE` - NEAREST_PROVINCE
        * `NONE` - NONE
    SessionCredentials:
      type: object
      description: Issued on registration, login and refresh.
      properties:
        accessToken:
          type: string
          description: Short-lived JOSE/JWT access token for the Authorization header.
        refreshToken:
          type: string
          description: Opaque rotating refresh secret. Store it in platform secure
            storage and replace it on every refresh; the server keeps only a digest.
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Expiry of the refresh session.
      required:
      - accessToken
      - expiresAt
      - refreshToken
      - sessionId
    SpecialtyScopeEnum:
      enum:
      - CATEGORY
      - SPECIALIZATION
      type: string
      description: |-
        * `CATEGORY` - One category
        * `SPECIALIZATION` - Every category of a specialization
    TemporaryClosure:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 240
      required:
      - endsAt
      - id
      - startsAt
    TemporaryClosureInput:
      type: object
      description: A temporary closure as the client sends it. The server assigns
        the id.
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 240
      required:
      - endsAt
      - startsAt
    TemporaryClosureList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemporaryClosure'
      required:
      - items
    UnreadCount:
      type: object
      properties:
        unreadCount:
          type: integer
      required:
      - unreadCount
    UserSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
      required:
      - createdAt
      - deviceName
      - id
      - lastSeenAt
      - platform
      - revoked
    UserSessionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSession'
      required:
      - items
  securitySchemes:
    bearerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Short-lived access token issued by the auth endpoints. Send it
        as `Authorization: Bearer <accessToken>`. The rotating refresh secret is not
        accepted here.'
