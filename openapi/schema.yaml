          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/push-token/:
    put:
      operationId: accountPushTokenRegister
      description: Idempotent. A new token from the same session replaces the previous
        one. The token is tied to the calling session and deactivated when that session
        ends.
      summary: Register or refresh this device's push token
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRegister'
          application/x-www-form-urlencoded:
