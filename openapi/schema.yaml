        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/profile/image/:
    put:
      operationId: accountProfileImageUpdate
      description: Sent as multipart/form-data. The server decodes the file, enforces
        byte and pixel limits, re-encodes to JPEG and strips metadata — a photograph
        carries where it was taken. The declared extension and MIME type are not trusted.
      summary: Upload or replace the profile picture of the caller
      tags:
      - Account
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileImageUpload'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
