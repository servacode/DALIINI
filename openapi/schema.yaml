          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
    patch:
      operationId: accountProfileUpdate
      summary: Update the display name or profile province of the caller
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfilePatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfilePatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfilePatch'
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
