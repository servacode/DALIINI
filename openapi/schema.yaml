        rejects the forbidden keys listed in `16-ADS-ANALYTICS-AUDIT.md` such as raw
        coordinates, phone numbers and tokens.
      properties:
        name:
          type: string
          description: Registered event name.
        properties:
          type: object
          additionalProperties: {}
          description: Event properties, restricted to the keys declared for this
            event.
