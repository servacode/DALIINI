          format: uuid
      required:
      - accepted
      - id
    AnalyticsEventRequest:
      type: object
      description: |-
        The view reads the body directly; this describes the accepted shape.

        `properties` is validated server-side against the central event registry, which
        rejects the forbidden keys listed in `16-ADS-ANALYTICS-AUDIT.md` such as raw
        coordinates, phone numbers and tokens.
      properties:
        name:
          type: string
          description: Registered event name.
        properties:
          type: object
          additionalProperties: {}
          description: Event properties, restricted to the keys declared for this
            event.
        occurredAt:
          type: string
          format: date-time
          description: Client-side event time, ISO-8601. Defaults to receipt time.
      required:
      - name
    ApiError:
      type: object
      description: The single error envelope returned by every failing request.
      properties:
        code:
          type: string
          description: Stable machine-readable code. Clients branch on this and never
            on `message`. Transport codes are VALIDATION_ERROR, AUTHENTICATION_REQUIRED,
            AUTHENTICATION_FAILED, PERMISSION_DENIED, NOT_FOUND, METHOD_NOT_ALLOWED,
            NOT_ACCEPTABLE, UNSUPPORTED_MEDIA_TYPE, THROTTLED and INTERNAL_ERROR;
            domain codes such as DUTY_OVERLAP_OR_INVALID are documented on the operations
            that raise them.
        message:
          type: string
          description: Human-readable Arabic message, safe to display. Never parsed
            by clients.
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-scoped messages keyed by request field path. Nested paths
            are joined with dots and list indices are bracketed, for example `contacts[1].phone`.
            A message with no field of its own appears under `nonFieldErrors`. Empty
            when the error is not field-scoped.
        requestId:
          type: string
          description: The request correlation id, identical to the `X-Request-ID`
            response header and to the id recorded in the server logs. Quote it in
            a support report.
      required:
      - code
      - details
      - message
      - requestId
    Availability:
      type: object
      description: Computed server-side by the availability engine; clients must not
        recompute it.
      properties:
        state:
          $ref: '#/components/schemas/AvailabilityStateEnum'
        nextOpenAt:
          type: string
          format: date-time
          nullable: true
        isOpenNow:
          type: boolean
          description: 'Whether the doors are open at this moment, by the facility''s
            own business hours and temporary closures. Independent of duty: unlike
            `state`, which collapses both into one value and lets DUTY win, this stays
            true for a facility that is open while its duty shift runs.'
        isOnDutyToday:
          type: boolean
          description: 'Whether the facility appears on today''s duty roster, taking
            today to be the local day in Asia/Damascus. A different question from
            being open: a pharmacy on tonight''s roster is on duty today from midnight,
            hours before it opens. False simply means it is not on the roster; clients
            must not render that as a badge of its own.'
      required:
      - isOnDutyToday
      - isOpenNow
      - nextOpenAt
      - state
    AvailabilityStateEnum:
      enum:
      - TEMP_CLOSED
      - DUTY
      - OPEN
      - CLOSED
      type: string
      description: |-
        * `TEMP_CLOSED` - TEMP_CLOSED
        * `DUTY` - DUTY
        * `OPEN` - OPEN
        * `CLOSED` - CLOSED
