openapi: 3.0.3
info:
  title: Directory Platform API
  version: 1.0.0
  description: Canonical contract for the Serva Code Directory Platform. Generated
    from Django and DRF; it is never hand-authored. Generated TypeScript, Kotlin and
    Swift clients are produced from this document, so no client hand-writes transport
    DTOs.
paths:
  /api/v1/account/deletion-request/:
    post:
      operationId: accountDeletionRequestCreate
      description: Required by Play policy for any app that creates accounts. Ownership
        obligations and legally retained records are handled by the deletion policy.
      summary: Request deletion of the account of the caller
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequested'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/favorites/:
    get:
      operationId: accountFavoritesList
      description: Newest first, cursor-paginated. A saved facility that is no longer
        public — closed, suspended, or in a category the province stopped serving
        — is not returned, because this list is served by the same public query every
        other list uses.
      summary: List the facilities the caller has saved
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque token returned as `nextCursor` by the previous page.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, maximum 100, default 30.
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
    post:
      operationId: accountFavoriteAdd
      description: 'Idempotent: saving a facility that is already saved changes nothing.'
      summary: Save a facility
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FavoriteWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FavoriteWrite'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The addressed resource does not exist or is not visible to
            the caller.
  /api/v1/account/favorites/{facility_id}/:
    delete:
      operationId: accountFavoriteRemove
      description: 'Idempotent: removing what was not saved is not an error.'
      summary: Remove a facility the caller had saved
      parameters:
      - in: path
        name: facility_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/invitations/:
    get:
      operationId: accountInvitationsList
      summary: Invitations waiting for this account's phone number
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedInvitationList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/invitations/{invitation_id}/accept/:
    post:
      operationId: accountInvitationAccept
      description: Only the account whose phone number was invited can accept; any
        other caller gets 404. An invitation to own raises a manager to owner and
        never lowers anyone. 409 INVITATION_EXPIRED or INVITATION_CLOSED when it can
        no longer be accepted.
      summary: Join the facility an invitation is for
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The addressed resource does not exist or is not visible to
            the caller.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The request conflicts with the current state or with a domain
            rule.
  /api/v1/account/invitations/{invitation_id}/decline/:
    post:
      operationId: accountInvitationDecline
      summary: Decline an invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The addressed resource does not exist or is not visible to
            the caller.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The request conflicts with the current state or with a domain
            rule.
  /api/v1/account/mfa/:
    get:
      operationId: accountMfaRetrieve
      summary: The second sign-in step, for this account and session
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/mfa/confirm/:
    post:
      operationId: accountMfaConfirm
      description: Enables it, marks this session as having passed the second step,
        and returns ten recovery codes, shown this once.
      summary: Confirm the authenticator with its first code
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaCode'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodes'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A domain rule rejected the request; `code` names the rule.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The request conflicts with the current state or with a domain
            rule.
  /api/v1/account/mfa/disable/:
    post:
      operationId: accountMfaDisable
      description: Needs a current code from the app. Refused with 409 MFA_REQUIRED_BY_POLICY
        where every operator must have one.
      summary: Switch the authenticator off
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaCode'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A domain rule rejected the request; `code` names the rule.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The request conflicts with the current state or with a domain
            rule.
  /api/v1/account/mfa/setup/:
    post:
      operationId: accountMfaSetup
      description: Operators only. Returns a new secret and its QR code; nothing is
        enabled until a code from the app confirms it. Starting again replaces an
        unconfirmed secret.
      summary: Start setting up an authenticator app
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The request conflicts with the current state or with a domain
            rule.
  /api/v1/account/mfa/verify/:
    post:
      operationId: accountMfaVerify
      description: A code from the app, or one of the recovery codes (each works once).
      summary: Pass the second step for this session
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaCode'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A domain rule rejected the request; `code` names the rule.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The request conflicts with the current state or with a domain
            rule.
  /api/v1/account/notification-preferences/:
    get:
      operationId: accountNotificationPreferencesRetrieve
      description: 'All are on until the account turns one off. Only the push is governed:
        every message still reaches the inbox. A staff change to an owner''s own duty
        shift, and any kind outside these three, is always pushed.'
      summary: Which kinds of notice are pushed to this account's devices
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
    patch:
      operationId: accountNotificationPreferencesUpdate
      description: Only the fields sent change.
      summary: Change which kinds of notice are pushed
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferences'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferences'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferences'
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/notifications/:
    get:
      operationId: accountNotificationsList
      description: |-
        The account's own inbox.

        Every message the platform has sent this account is here whether or not a push ever
        reached the device, which is what makes the inbox the record and the push only an
        announcement.
      summary: List the caller's notifications, newest first
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque token returned as `nextCursor` by the previous page.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, maximum 100, default 30.
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/notifications/{notification_id}/read/:
    post:
      operationId: accountNotificationMarkRead
      description: 'Idempotent: a message that was already read keeps the time it
        was read.'
      summary: Mark one notification as read
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The addressed resource does not exist or is not visible to
            the caller.
  /api/v1/account/notifications/read-all/:
    post:
      operationId: accountNotificationsMarkAllRead
      summary: Mark every unread notification as read
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/notifications/unread-count/:
    get:
      operationId: accountNotificationsUnreadCount
      summary: How many of the caller's notifications are unread
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/password/:
    post:
      operationId: accountPasswordChange
      description: The caller proves the current password first. A successful change
        revokes every session, including this one, so the caller signs in again with
        the new password.
      summary: Change the caller's password
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/phone/confirm/:
    post:
      operationId: accountPhoneChangeConfirm
      description: 'Every session ends, this one included: the phone is how this account
        signs in, so a session issued to the old identity does not outlive it.'
      summary: Confirm the code and move the account to the new number
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChallengeVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChallengeVerify'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Rate limit exceeded for this endpoint; see the `Retry-After`
            header.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/phone/start/:
    post:
      operationId: accountPhoneChangeStart
      description: The code is sent to the new number, which is what proves the caller
        can receive on it. The account is not changed until the code is confirmed.
      summary: Start moving the account to another phone number
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneChangeStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneChangeStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneChangeStart'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeAccepted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The code cannot be delivered to this number at all; `code`
            is OTP_RECIPIENT_INVALID. Asking again for the same number will not help.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Rate limit exceeded for this endpoint; see the `Retry-After`
            header.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The code could not be sent just now; `code` is OTP_DELIVERY_UNAVAILABLE.
            The same request may succeed in a little while.
        '401':
