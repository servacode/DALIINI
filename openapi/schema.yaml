components:
  schemas:
    Accepted:
      type: object
      properties:
        facilityId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/FacilityMemberRoleEnum'
      required:
      - facilityId
      - role
    AccountDeletionRequested:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountDeletionStatusEnum'
      required:
      - id
      - status
    AccountDeletionStatusEnum:
      enum:
      - REQUESTED
      - COMPLETED
      - REJECTED
      type: string
      description: |-
        * `REQUESTED` - Requested
        * `COMPLETED` - Completed
        * `REJECTED` - Rejected
    AccountRating:
      type: object
      properties:
        facilityId:
          type: string
          format: uuid
        facilityNameAr:
          type: string
        stars:
          type: integer
          maximum: 5
          minimum: 1
        updatedAt:
          type: string
          format: date-time
      required:
      - facilityId
      - facilityNameAr
      - stars
      - updatedAt
    AccountRatingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountRating'
      required:
      - items
    AdStat:
      type: object
      properties:
        adId:
          type: string
          format: uuid
        titleAr:
          type: string
        impressions:
          type: integer
          minimum: 0
        clicks:
          type: integer
          minimum: 0
        clickRate:
          type: number
          format: double
          nullable: true
          description: Clicks per impression, 0..1; null with no impressions.
      required:
      - adId
      - clickRate
      - clicks
      - impressions
      - titleAr
    AdStats:
      type: object
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdStat'
      required:
      - fromDate
      - items
      - toDate
    AdminAdImage:
      type: object
      properties:
        imageKey:
          type: string
          description: Pass as `imageKey` when saving the ad.
        url:
          type: string
          description: Permanent public media address.
        width:
          type: integer
        height:
          type: integer
      required:
      - height
      - imageKey
      - url
      - width
    AdminAdImageUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP, at most 2 MB, 100-4096 px a side.
      required:
      - file
    AdminAdvertisement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        titleAr:
          type: string
        targetScope:
          $ref: '#/components/schemas/AdvertisementTargetScopeEnum'
        provinceId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
          nullable: true
          readOnly: true
          description: Where the slide's image is served from, to preview it while
            editing.
        enabled:
          type: boolean
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        sortOrder:
          type: integer
        slideDurationMs:
          type: integer
      required:
      - categoryId
      - enabled
      - endsAt
      - id
      - imageUrl
      - provinceId
      - slideDurationMs
      - sortOrder
      - startsAt
      - targetScope
      - titleAr
    AdminAdvertisementList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAdvertisement'
      required:
      - items
    AdminAdvertisementRequest:
      type: object
      properties:
        imageKey:
          type: string
        titleAr:
          type: string
        titleEn:
          type: string
        subtitleAr:
          type: string
        subtitleEn:
          type: string
        actionType:
          $ref: '#/components/schemas/AdvertisementActionTypeEnum'
        actionPayload:
          type: object
          additionalProperties: {}
        targetScope:
          $ref: '#/components/schemas/AdvertisementTargetScopeEnum'
        provinceId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        enabled:
          type: boolean
          default: false
        sortOrder:
          type: integer
          default: 0
        slideDurationMs:
          type: integer
          default: 5000
      required:
      - imageKey
    AdminAdvertisementUpdateRequest:
      type: object
      description: |-
        Edit an advertisement in place; omitted fields keep their current value.

        The field set is fixed by `06-DATA-MODEL.md`. Schedule, targeting and action payload are
        validated by the model, so an end before its start, an out-of-range slide duration, a
        global advertisement carrying a target, or a payload that does not match its action type
        are all refused there rather than re-checked here.
      properties:
        imageKey:
          type: string
        titleAr:
          type: string
        titleEn:
          type: string
        subtitleAr:
          type: string
        subtitleEn:
          type: string
        actionType:
          $ref: '#/components/schemas/AdvertisementActionTypeEnum'
        actionPayload:
          type: object
          additionalProperties: {}
        targetScope:
          $ref: '#/components/schemas/AdvertisementTargetScopeEnum'
        provinceId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        enabled:
          type: boolean
        sortOrder:
          type: integer
        slideDurationMs:
          type: integer
    AdminAlert:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AdminAlertKindEnum'
        severity:
          $ref: '#/components/schemas/AdminAlertSeverityEnum'
        titleAr:
          type: string
        detailAr:
          type: string
        count:
          type: integer
        link:
          allOf:
          - $ref: '#/components/schemas/AdminAlertLink'
          nullable: true
      required:
      - count
      - detailAr
      - kind
      - link
      - severity
      - titleAr
    AdminAlertKindEnum:
      enum:
      - DUTY_GAP
      - STALE_FACILITY
      - REPORTED_FACILITY
      - ZERO_RESULT_SEARCH
      - REVIEW_OVERDUE
      - MAINTENANCE_ON
      type: string
      description: |-
        * `DUTY_GAP` - Duty gap
        * `STALE_FACILITY` - Stale facilities
        * `REPORTED_FACILITY` - Repeatedly reported facility
        * `ZERO_RESULT_SEARCH` - Searches with no results
        * `REVIEW_OVERDUE` - Reviews past the SLA
        * `MAINTENANCE_ON` - Maintenance mode is on
    AdminAlertLink:
      type: object
      properties:
        entityType:
          $ref: '#/components/schemas/AdminLinkEntityTypeEnum'
        entityId:
          type: string
          nullable: true
        query:
          type: string
          nullable: true
          description: Query string for the linked list screen, if any.
      required:
      - entityId
      - entityType
      - query
    AdminAlertList:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAlert'
          description: Critical first, then warning, then info.
      required:
      - generatedAt
      - items
    AdminAlertSeverityEnum:
      enum:
      - info
      - warning
      - critical
      type: string
      description: |-
        * `info` - Info
        * `warning` - Warning
        * `critical` - Critical
    AdminAnalytics:
      type: object
      properties:
        from:
          type: string
          format: date-time
          description: Period start, inclusive.
        to:
          type: string
          format: date-time
          description: Period end, exclusive.
        approvalMedianHours:
          type: number
          format: double
          nullable: true
          description: Median submit-to-approval time in the period.
        searches:
          type: integer
          description: search_submitted events in the period.
        zeroResultSearches:
          type: integer
          description: search_zero_results in the period.
        facilityViews:
          type: integer
          description: facility_view events in the period.
        directionsRequests:
          type: integer
          description: directions_start in the period.
        previous:
          allOf:
          - $ref: '#/components/schemas/AdminAnalyticsPeriodKpis'
          description: The same KPIs for the equally long period just before `from`.
        activeFacilities:
          type: integer
        pendingReviews:
          type: integer
        ratingAverage:
          type: number
          format: double
          nullable: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/AdminEventCount'
          description: All-time counts per event name.
      required:
      - activeFacilities
      - approvalMedianHours
      - directionsRequests
      - events
      - facilityViews
      - from
      - pendingReviews
      - previous
      - ratingAverage
      - searches
      - to
      - zeroResultSearches
    AdminAnalyticsPeriodKpis:
      type: object
      description: The period-bound KPIs of the comparison period, `from` inclusive,
        `to` exclusive.
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        approvalMedianHours:
          type: number
          format: double
          nullable: true
        searches:
          type: integer
        zeroResultSearches:
          type: integer
        facilityViews:
          type: integer
        directionsRequests:
          type: integer
      required:
      - approvalMedianHours
      - directionsRequests
      - facilityViews
      - from
      - searches
      - to
      - zeroResultSearches
    AdminAppRelease:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/PushPlatformEnum'
        minimumVersionCode:
          type: integer
        latestVersionCode:
          type: integer
        storeUrl:
