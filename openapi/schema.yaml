        name: cursor
        schema:
          type: string
        description: Opaque token returned as `nextCursor` by the previous page.
      - in: query
        name: from
        schema:
          type: string
        description: ISO date or datetime; keeps entries created at or after it.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, maximum 200, default 50.
      - in: query
        name: requestId
        schema:
          type: string
        description: Exact request correlation id, as returned in an error body.
      - in: query
        name: resource
        schema:
          type: string
        description: Substring matched against the target type, or an exact target
          id.
      - in: query
        name: to
        schema:
          type: string
        description: ISO date or datetime; a bare date includes that whole day.
