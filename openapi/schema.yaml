        description: Caller longitude in WGS84 decimal degrees. Must be sent with
          latitude.
      - in: query
        name: neighborhoodId
        schema:
          type: string
        description: Optional neighbourhood filter.
      - in: query
        name: openNow
        schema:
          type: string
        description: Pass true to keep only facilities open at this moment.
      - in: query
        name: provinceId
        schema:
          type: string
        description: Province to scope the query to.
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Free-text term matched against facility text.
      - in: query
        name: serviceId
        schema:
          type: string
        description: Optional service-tag filter; only meaningful when the category
          declares serviceFilter.
      - in: query
        name: specialtyId
        schema:
          type: string
        description: Optional specialty filter; only meaningful when the category
          declares specialtyFilter.
      tags:
      - Public Discovery
      security:
      - bearerAccessToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapMarkerList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
  /api/v1/public/provinces/:
    get:
      operationId: publicProvincesList
      description: Every province is seeded, but only active ones are publicly visible.
        Ordered by sort order then Arabic name.
      summary: List active provinces
      tags:
      - Public Taxonomy
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProvinceList'
          description: ''
  /api/v1/public/provinces/{province_id}/categories/:
    get:
      operationId: publicProvinceCategoriesList
      description: A category is listed only when the province is active, the group
        and the category are active, and the per-province public switch is on. Clients
        drive their UI from the returned capability flags, never from the category
        name.
      summary: List categories publicly enabled for a province
      parameters:
      - in: path
        name: province_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Public Taxonomy
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCategoryList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The addressed resource does not exist or is not visible to
            the caller.
  /api/v1/public/provinces/{province_id}/cities/:
    get:
      operationId: publicProvinceCitiesList
      summary: List active cities in a province
      parameters:
      - in: path
        name: province_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Public Taxonomy
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCityList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The addressed resource does not exist or is not visible to
            the caller.
  /api/v1/public/search/:
    get:
      operationId: publicSearchList
      summary: Search facilities within a province
      parameters:
      - in: query
        name: bbox
        schema:
          type: string
        description: Viewport as west,south,east,north in WGS84 decimal degrees.
      - in: query
        name: categoryId
        schema:
          type: string
        description: Optional category filter.
      - in: query
        name: cityId
        schema:
          type: string
        description: Optional city filter.
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque token returned as `nextCursor` by the previous page.
      - in: query
        name: latitude
        schema:
          type: string
        description: Caller latitude in WGS84 decimal degrees. Must be sent with longitude.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, maximum 100, default 30.
      - in: query
        name: longitude
        schema:
          type: string
        description: Caller longitude in WGS84 decimal degrees. Must be sent with
          latitude.
      - in: query
        name: neighborhoodId
        schema:
          type: string
        description: Optional neighbourhood filter.
      - in: query
        name: provinceId
        schema:
          type: string
        description: Province to scope the query to.
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: Search term, at least two characters.
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Free-text term matched against facility text.
      - in: query
        name: serviceId
        schema:
          type: string
        description: Optional service-tag filter; only meaningful when the category
          declares serviceFilter.
      - in: query
        name: specialtyId
        schema:
          type: string
        description: Optional specialty filter; only meaningful when the category
          declares specialtyFilter.
      tags:
      - Public Discovery
      security:
      - bearerAccessToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityCursorPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
