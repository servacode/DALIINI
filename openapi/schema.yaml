          description: 'Whether the facility appears on today''s duty roster, taking
            today to be the local day in Asia/Damascus. A different question from
            being open: a pharmacy on tonight''s roster is on duty today from midnight,
            hours before it opens. False simply means it is not on the roster; clients
            must not render that as a badge of its own.'
