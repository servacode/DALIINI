openapi: 3.0.3
info:
  title: Directory Platform API
  version: 1.0.0
  description: Canonical contract for the Serva Code Directory Platform. Generated
    from Django and DRF; it is never hand-authored. Generated TypeScript, Kotlin and
    Swift clients are produced from this document, so no client hand-writes transport
    DTOs.
paths:
  /api/v1/account/deletion-request/:
    post:
      operationId: accountDeletionRequestCreate
      description: Required by Play policy for any app that creates accounts. Ownership
        obligations and legally retained records are handled by the deletion policy.
      summary: Request deletion of the account of the caller
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionRequest'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequested'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/favorites/:
    get:
      operationId: accountFavoritesList
      description: Newest first, cursor-paginated. A saved facility that is no longer
        public — closed, suspended, or in a category the province stopped serving
        — is not returned, because this list is served by the same public query every
        other list uses.
      summary: List the facilities the caller has saved
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque token returned as `nextCursor` by the previous page.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, maximum 100, default 30.
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
    post:
      operationId: accountFavoriteAdd
      description: 'Idempotent: saving a facility that is already saved changes nothing.'
      summary: Save a facility
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FavoriteWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FavoriteWrite'
        required: true
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request validation failed; `code` is VALIDATION_ERROR and `details`
            is populated.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The addressed resource does not exist or is not visible to
            the caller.
  /api/v1/account/favorites/{facility_id}/:
    delete:
      operationId: accountFavoriteRemove
      description: 'Idempotent: removing what was not saved is not an error.'
      summary: Remove a facility the caller had saved
      parameters:
      - in: path
        name: facility_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/notifications/:
    get:
      operationId: accountNotificationsList
      description: |-
        The account's own inbox.

        Every message the platform has sent this account is here whether or not a push ever
        reached the device, which is what makes the inbox the record and the push only an
        announcement.
      summary: List the caller's notifications, newest first
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque token returned as `nextCursor` by the previous page.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, maximum 100, default 30.
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
  /api/v1/account/notifications/{notification_id}/read/:
    post:
      operationId: accountNotificationMarkRead
      description: 'Idempotent: a message that was already read keeps the time it
        was read.'
      summary: Mark one notification as read
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The addressed resource does not exist or is not visible to
            the caller.
  /api/v1/account/notifications/read-all/:
    post:
      operationId: accountNotificationsMarkAllRead
      summary: Mark every unread notification as read
      tags:
