      summary: Delete an advertisement
      parameters:
      - in: path
        name: advertisement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Ads
      security:
      - bearerAccessToken: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
