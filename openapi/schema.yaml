      description: 'Ordered nearest-first when coordinates are supplied, otherwise
        by Arabic name. Availability is computed by the backend. The filters combine:
        openNow and dutyToday together mean facilities that are both, which is a different
        question from either alone.'
      summary: List publicly visible facilities in a province, optionally in one category
      parameters:
      - in: query
        name: bbox
        schema:
          type: string
        description: Viewport as west,south,east,north in WGS84 decimal degrees.
      - in: query
        name: categoryId
        schema:
          type: string
        description: Optional category to list. Absent means the whole province.
      - in: query
        name: cityId
        schema:
          type: string
        description: Optional city filter.
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque token returned as `nextCursor` by the previous page.
      - in: query
        name: dutyNow
        schema:
          type: string
        description: Pass true to keep only facilities whose duty shift is running.
      - in: query
        name: dutyToday
        schema:
          type: string
        description: Pass true to keep only facilities on today's duty roster.
      - in: query
        name: latitude
        schema:
          type: string
