  /api/v1/public/facilities/:
    get:
      operationId: publicFacilitiesList
      description: 'Ordered nearest-first when coordinates are supplied, otherwise
        by Arabic name. Availability is computed by the backend. The filters combine:
        openNow and dutyToday together mean facilities that are both, which is a different
        question from either alone.'
      summary: List publicly visible facilities in a province, optionally in one category
      parameters:
      - in: query
        name: bbox
        schema:
          type: string
        description: Viewport as west,south,east,north in WGS84 decimal degrees.
      - in: query
        name: categoryId
        schema:
          type: string
        description: Optional category to list. Absent means the whole province.
      - in: query
        name: cityId
        schema:
          type: string
        description: Optional city filter.
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque token returned as `nextCursor` by the previous page.
      - in: query
        name: dutyNow
        schema:
          type: string
        description: Pass true to keep only facilities whose duty shift is running.
      - in: query
        name: dutyToday
        schema:
          type: string
        description: Pass true to keep only facilities on today's duty roster.
      - in: query
        name: latitude
        schema:
          type: string
        description: Caller latitude in WGS84 decimal degrees. Must be sent with longitude.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, maximum 100, default 30.
      - in: query
        name: longitude
        schema:
          type: string
        description: Caller longitude in WGS84 decimal degrees. Must be sent with
          latitude.
      - in: query
        name: neighborhoodId
        schema:
          type: string
        description: Optional neighbourhood filter.
      - in: query
        name: openNow
        schema:
          type: string
        description: Pass true to keep only facilities open at this moment.
      - in: query
        name: provinceId
        schema:
          type: string
        description: Province to scope the query to.
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Free-text term matched against facility text.
      - in: query
        name: serviceId
        schema:
          type: string
        description: Optional service-tag filter; only meaningful when the category
          declares serviceFilter.
      - in: query
        name: sort
        schema:
          type: string
        description: 'nearest orders by distance and needs coordinates; name orders
          by Arabic name. Omitted keeps the historical behaviour: nearest whenever
          coordinates are supplied, name otherwise. Distances are returned whenever
          coordinates are supplied, whichever ordering is asked for.'
      - in: query
        name: specialtyId
        schema:
          type: string
        description: Optional specialty filter; only meaningful when the category
          declares specialtyFilter.
      tags:
      - Public Discovery
      security:
      - bearerAccessToken: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityCursorPage'
