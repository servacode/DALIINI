    ApiError:
      type: object
      description: The single error envelope returned by every failing request.
      properties:
        code:
          type: string
          description: Stable machine-readable code. Clients branch on this and never
            on `message`. Transport codes are VALIDATION_ERROR, AUTHENTICATION_REQUIRED,
            AUTHENTICATION_FAILED, PERMISSION_DENIED, NOT_FOUND, METHOD_NOT_ALLOWED,
            NOT_ACCEPTABLE, UNSUPPORTED_MEDIA_TYPE, THROTTLED and INTERNAL_ERROR;
            domain codes such as DUTY_OVERLAP_OR_INVALID are documented on the operations
            that raise them.
        message:
          type: string
          description: Human-readable Arabic message, safe to display. Never parsed
            by clients.
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-scoped messages keyed by request field path. Nested paths
            are joined with dots and list indices are bracketed, for example `contacts[1].phone`.
            A message with no field of its own appears under `nonFieldErrors`. Empty
            when the error is not field-scoped.
        requestId:
          type: string
          description: The request correlation id, identical to the `X-Request-ID`
            response header and to the id recorded in the server logs. Quote it in
            a support report.
      required:
      - code
      - details
      - message
      - requestId
