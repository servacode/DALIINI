        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No valid access token was supplied.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but the caller lacks the required permission
            or membership.
    delete:
      operationId: accountProfileImageDelete
      description: 'The picture on the account: one at a time, replaced or removed.'
      summary: Remove the profile picture of the caller
      tags:
      - Account
      security:
      - bearerAccessToken: []
      responses:
        '200':
          content:
