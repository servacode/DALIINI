# Directory Platform V3 — production blueprint.
#
# The staging blueprint beside this one (render.yaml) is where a change is proven. This is the
# same shape with three deliberate differences:
#
#   1. **Nothing that serves traffic deploys itself.** `autoDeployTrigger: "off"` on every
#      service: a green pipeline is a reason to deploy, not a decision to. Production deploys
#      are a person's act, from the dashboard or the API, after staging has been looked at.
#      It is quoted because an unquoted `off` is YAML's boolean false, not the word. The backup
#      cron carries no trigger, as in the staging blueprint: it runs on its schedule, and
#      redeploying its image changes nothing about when.
#   2. **Every secret is its own.** No value is shared with staging — not a key, not a bucket,
#      not a token. A staging leak must cost nothing here, and a staging run must never be able
#      to write to production's storage or send to production's users.
#   3. **It refuses to start when it is not ready.** directory_backend.settings.production
#      checks each of these at import: a short signing key, a wildcard host, a test OTP or push
#      provider, FCM without its service account. Every key below exists because that module
#      requires it — the list is not a convention, it is what makes the process boot.
#
# Restoring a backup, rolling back a deploy and answering an incident are in
# docs/runbooks/. This file only describes what runs.

services:
  - type: keyvalue
    name: directory-v3-redis
    plan: 256mb
    region: frankfurt
    ipAllowList: []
    # Celery's broker lives here. Evicting a key under memory pressure would silently drop a
    # queued push or a scheduled task, so it refuses writes instead and the error is visible.
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: directory-v3-api
    runtime: docker
    plan: 1c-2gb
    region: frankfurt
    dockerContext: ./apps/backend
    dockerfilePath: ./apps/backend/Dockerfile
    dockerCommand: uv run daphne -b 0.0.0.0 -p ${PORT:-10000} directory_backend.asgi:application
    healthCheckPath: /health/ready/
    autoDeployTrigger: "off"
    # Both run before the new instance takes traffic. `check --deploy` is Django's own audit of
    # the settings that matter in production; migrate is idempotent and safe to repeat.
    preDeployCommand: uv run python manage.py check --deploy && uv run python manage.py migrate --noinput
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: directory-v3-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: directory-v3-redis
          property: connectionString
      - fromGroup: directory-v3-backend

  - type: worker
    name: directory-v3-worker
    runtime: docker
    plan: 0.5c-1gb
    region: frankfurt
    dockerContext: ./apps/backend
    dockerfilePath: ./apps/backend/Dockerfile
    dockerCommand: uv run celery -A directory_backend worker -l INFO
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: directory-v3-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: directory-v3-redis
          property: connectionString
      - fromGroup: directory-v3-backend

  # The single scheduler for CELERY_BEAT_SCHEDULE. Exactly one instance, always: two beats
  # enqueue every periodic task twice, and the duplicate is a second push to every device.
  - type: worker
    name: directory-v3-beat
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerContext: ./apps/backend
    dockerfilePath: ./apps/backend/Dockerfile
    dockerCommand: uv run celery -A directory_backend beat --loglevel=info
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: directory-v3-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: directory-v3-redis
          property: connectionString
      - fromGroup: directory-v3-backend

  # Nightly logical backup to S3-compatible storage (scripts/db-backup.sh). A backup nobody has
  # restored is a hope, not a backup: infrastructure/BACKUP-RESTORE.md is the drill.
  - type: cron
    name: directory-v3-db-backup
    runtime: docker
    plan: starter
    region: frankfurt
    schedule: "17 2 * * *"
    dockerContext: .
    dockerfilePath: ./infrastructure/backup/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: directory-v3-db
          property: connectionString
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: directory-v3/postgres
      # Longer than staging's fourteen: production is what anyone would ever restore.
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto

  # The OTP bot: a paired WhatsApp account that sends registration codes. Private on purpose —
  # a service that sends WhatsApp messages to any number given to it must never be reachable
  # from the internet — and reached by the API at http://directory-v3-whatsapp-bot:8085.
  #
  # The disk is the account. Pairing writes credentials into it once, and losing it stops
  # registration for everyone until somebody scans a new code with the phone in hand.
  #
  # This route drives an ordinary WhatsApp account through an unofficial library, which is
  # outside WhatsApp's terms and can be banned without warning. OTP_PROVIDER=whatsapp in the
  # group moves delivery to the official Cloud API without touching this service.
  - type: pserv
    name: directory-v3-whatsapp-bot
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerContext: ./services/whatsapp-bot
    dockerfilePath: ./services/whatsapp-bot/Dockerfile
    autoDeployTrigger: "off"
    disk:
      name: whatsapp-auth
      mountPath: /app/auth
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8085"
      - key: WHATSAPP_BOT_TOKEN
        sync: false

  - type: web
    name: directory-v3-www
    runtime: docker
    plan: 0.5c-1gb
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      # The site's server calls the public API for every visitor and presents this key so it is
      # counted under its own limit rather than as one very busy address. Must match the
      # backend group's value. It grants no data and no permission.
      - key: WEB_SERVER_API_KEY
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Build-time (ARG in apps/web/Dockerfile): the API origin the browser posts the contact
      # form to, the store links, and the Android package that «افتح في التطبيق» and
      # /.well-known/assetlinks.json name.
      - key: NEXT_PUBLIC_API_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_PLAY_STORE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_STORE_URL
        sync: false
      - key: NEXT_PUBLIC_ANDROID_PACKAGE
        sync: false
      # SHA-256 fingerprint(s) of the Play app-signing certificate, comma separated. Wrong here
      # and every App Link opens the browser instead of the app.
      - key: ANDROID_CERT_SHA256
        sync: false

  - type: web
    name: directory-v3-admin
    runtime: docker
    plan: 0.5c-1gb
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./apps/admin/Dockerfile
    healthCheckPath: /login
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: Directory Admin
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false

databases:
  - name: directory-v3-db
    plan: 1c-4gb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: directory_v3
    user: directory_v3
    # Empty: nothing outside this Render network reaches the database. A restore runs from a
    # service in it, not from somebody's laptop.
    ipAllowList: []
    connectionPool: none

# Shared by the API, the worker and beat: one Django settings module, one configuration.
# fromDatabase/fromService values cannot live in a group, so DATABASE_URL and REDIS_URL stay on
# each service above.
envVarGroups:
  - name: directory-v3-backend
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: directory_backend.settings.production
      - key: ENVIRONMENT
        value: production
      # Each at least 32 characters, and none may begin with CHANGE_ME: the settings module
      # refuses to import otherwise, so a half-configured deploy never serves a request.
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_SIGNING_KEY
        sync: false
      - key: REFRESH_HMAC_SECRET
        sync: false
      - key: RECOVERY_HMAC_SECRET
        sync: false
      - key: PUSH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ANALYTICS_HASH_SALT
        sync: false
      # Explicit hosts only; a wildcard is refused.
      - key: ALLOWED_HOSTS
        sync: false
      # Must include the public site's exact origin (https://ROOT_DOMAIN, no trailing slash):
      # the contact form posts to the API straight from the visitor's browser.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BUCKET
        sync: false
      - key: S3_PRIVATE_BUCKET
        sync: false
      # Where a facility photograph is read from by anyone, with no signature and no expiry.
      # Required in production and easy to forget — the staging blueprint does not carry it,
      # and without it the process stops at import rather than serving broken images.
      - key: S3_PUBLIC_MEDIA_BASE_URL
        sync: false
      # whatsapp (the official Cloud API) or whatsapp_bot (the paired account above). A test
      # provider is refused here: a production backend that only prints codes accepts sign-ups
      # nobody can complete.
      - key: OTP_PROVIDER
        sync: false
      # Required when OTP_PROVIDER=whatsapp.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: ar
      # Required when OTP_PROVIDER=whatsapp_bot. The token must match the bot service's own.
      - key: WHATSAPP_BOT_URL
        value: http://directory-v3-whatsapp-bot:8085
      - key: WHATSAPP_BOT_TOKEN
        sync: false
      # fcm. A test provider is refused, and fcm without both FCM values is refused too.
      - key: PUSH_PROVIDER
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      # The Firebase service account key the push transport signs with: the downloaded JSON,
      # pasted as is or base64-encoded.
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: WEB_SERVER_API_KEY
        sync: false
      - key: THROTTLE_WEB_SERVER
        value: 6000/minute
      - key: THROTTLE_CONTACT
        value: 3/hour
      # Render terminates TLS in one proxy hop, so the client address is the last
      # X-Forwarded-For entry. Wrong here and every rate limit counts the proxy instead of the
      # caller — which either throttles everyone at once or nobody at all.
      - key: DRF_NUM_PROXIES
        value: "1"
