# The build reads and writes source, so it fixes both halves of how text is handled: the encoding,
# and the locale that decides which digits a number is written with. Room's KSP processor formats
# the bind indices it generates with the default locale, so on a machine set to Arabic it emitted
# `var _argIndex: Int = ١` — the Arabic-Indic one, U+0661 — into generated Kotlin, and the compiler
# cannot read it. The build then fails on a developer's machine and passes on CI, which is the
# worst way for a build to be wrong. Nothing here changes what the app shows anyone: the app's own
# numbers are formatted at runtime from the phone's locale, not from the build's.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
# Kotlin compilation and KSP run in their own daemon, which does not inherit the above.
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
