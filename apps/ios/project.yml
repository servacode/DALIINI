# The iPhone app's Xcode project, generated by XcodeGen (`xcodegen generate` in apps/ios).
# The .xcodeproj is not committed: this file is the project, so a change to it is a reviewable
# diff rather than a pbxproj merge. DECISION-093.
name: Daliini
options:
  bundleIdPrefix: com.servacode
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The Kotlin framework's build runs Gradle, which reads and writes outside the sandbox
    # Xcode gives build scripts.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Signed to run on the simulator without a team; the App Store build is signed by the
    # owner's account (EXT for Apple), never from this repository.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Daliini:
    type: application
    platform: iOS
    sources:
      - path: Daliini
    info:
      path: Daliini/Info.plist
      properties:
        CFBundleDisplayName: دليني
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose draws at the screen's own rate (120 Hz on ProMotion phones).
        CADisableMinimumFrameDurationOnPhone: true
        # Read by the app at start; set per configuration in Config/*.xcconfig.
        DaliiniApiBaseUrl: $(API_BASE_URL)
        DaliiniAllowCleartext: $(ALLOW_CLEARTEXT)
        NSLocationWhenInUseUsageDescription: يستعمل دليني موقعك ليرتّب لك المنشآت بالأقرب ويعرض المسافة إليها، ولا يقرؤه في الخلفية.
        NSAppTransportSecurity:
          # Plain http only to this machine, for a development backend on localhost.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servacode.directory
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../android/ios-framework/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, DaliiniKit, -lsqlite3]
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/../android"
          ./gradlew :ios-framework:embedAndSignAppleFrameworkForXcode
  DaliiniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaliiniTests
    dependencies:
      - target: Daliini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servacode.directory.tests
        GENERATE_INFOPLIST_FILE: "YES"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../android/ios-framework/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # Hosted in the app, so the tests reach the Keychain as the app does.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Daliini.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Daliini
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Daliini:
    build:
      targets:
        Daliini: all
        DaliiniTests: [test]
    test:
      targets: [DaliiniTests]
      gatherCoverageData: false
